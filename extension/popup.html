<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>刊迹 · CiteLocus</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="hero">
    <div class="identity">
      <img class="brand-icon" src="icons/icon48.png" alt="" width="40" height="40">
      <div class="wordmark">
        <h1 id="brand"></h1>
        <span class="roman-name">CiteLocus</span>
      </div>
      <span class="version" id="version"></span>
    </div>
    <p class="tagline" id="tagline"></p>
  </header>
  <main>
    <section class="card" aria-labelledby="rankings-title">
      <h2 id="rankings-title"></h2>
      <div id="lists" class="checks ranking-lists"></div>
      <p class="hint" id="rankings-hint"></p>
    </section>
    <details class="card preferences">
      <summary id="settings-title"></summary>
      <div id="toggles" class="checks"></div>
      <label class="language">
        <span id="language-title"></span>
        <select id="locale">
          <option id="locale-auto" value=""></option>
          <option value="zh">简体中文</option>
          <option value="en">English</option>
        </select>
      </label>
      <button id="manage" type="button" class="manage"></button>
      <p class="hint" id="privacy"></p>
    </details>
  </main>
  <footer><output id="status" class="status" aria-live="polite"></output></footer>
  <script type="module" src="popup.mjs"></script>
</body>
</html>
